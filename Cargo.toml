[package]
name = "pumpkin-purge"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }
rand = "0.9.0"

# Bevy is slow in debug builds; optimize dependencies but keep our own code fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3